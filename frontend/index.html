<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="container">
        <div class="card">
            <h2>Gestão de Produtos</h2>
            <form id="form-produto">
                <div class="form-group">
                    <label>Nome do Produto</label>
                    <input type="text" id="nome" name="nome">
                    <span class="erro-msg" id="erro-nome"></span>
                </div>
                <div class="form-group">
                    <label>SKU (Código)</label>
                    <input type="text" id="sku" name="sku">
                    <span class="erro-msg" id="erro-sku"></span>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Preço (R$)</label>
                        <input type="number" step="0.01" id="preco" name="preco">
                        <span class="erro-msg" id="erro-preco"></span>
                    </div>
                    <div class="form-group">
                        <label>Estoque</label>
                        <input type="number" id="estoque" name="estoque">
                        <span class="erro-msg" id="erro-estoque"></span>
                    </div>
                </div>
                <button type="submit">Cadastrar Produto</button>
            </form>
            <div id="lista-produtos" class="lista-dados"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/produtos.js"></script>
</body>
</html>
